[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rax-logic"
version = "2.0.0"
description = "Rax Logic – Railway Physical Progress Module"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [{name = "Rax Development Team"}]

dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
fast = [
    "python-calamine>=0.1.0",
    "odfpy>=1.4.1",
]
pdf = [
    "pdfplumber>=0.10.0",
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]
all = [
    "rax-logic[fast,pdf,dev]",
]

[project.scripts]
rax-logic = "rax_disp_logic_optimised.cli.main:main"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
